name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: catches upstream drift (new dependency releases, runner images) while the repo is quiet.
    - cron: '17 5 * * 1'

# One run per ref; a newer push cancels an older pull-request run, never a main run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only token: the workflow only builds, tests and packs.
permissions:
  contents: read

jobs:
  test:
    name: lint · build · test · validate (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 22.12.0 is the declared engines floor; 22.x and 24.x are what people publish and install from.
        os: [ubuntu-latest]
        node: ['22.12.0', '22.x', '24.x']
        include:
          - os: macos-latest
            node: '22.x'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck (src + tests)
        run: npm run lint

      - name: Build (syncs the skills/agents mirror first)
        run: npm run build

      - name: Mirror must already be committed
        run: |
          npm run check:mirror
          git diff --exit-code -- skills agents

      - name: Unit tests
        run: npm test

      - name: Validate data (targets, domains, knowledge base)
        run: npm run validate

      - name: Knowledge-base manifest in sync
        run: npm run kb:check

      - name: Tarball contents
        run: npm run check:pack

      - name: Shell syntax
        run: |
          bash -n bin/qualiow bin/mcli bin/wadb bin/wk-ios bin/doctor-mobile.sh bin/setup-mobile.sh
          if command -v shellcheck >/dev/null; then shellcheck -S warning bin/qualiow bin/mcli bin/wadb bin/wk-ios bin/doctor-mobile.sh bin/setup-mobile.sh || true; fi
          node --check bin/mobile-cli.mjs
          node --check bin/wkeval.mjs
          for f in hooks/scripts/*.mjs; do node --check "$f"; done
          node bin/mobile-cli.mjs --help >/dev/null
          node bin/mobile-cli.mjs version

      - name: End-to-end install into a fresh project
        shell: bash
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP"
          TGZ="$(ls "$RUNNER_TEMP"/qualiow-exploratory-testing-*.tgz)"
          mkdir -p "$RUNNER_TEMP/proj" && cd "$RUNNER_TEMP/proj"
          npm init -y >/dev/null
          npm install --no-fund "$TGZ"
          npm audit --omit=dev --audit-level=high
          npx qualiow --version | grep -q "$(node -p "require('$GITHUB_WORKSPACE/package.json').version")"
          npx qualiow init
          npx qualiow init --hooks
          git init -q && git config user.email ci@example.com && git config user.name ci
          git add -A && git commit -qm init
          npx qualiow init
          npx qualiow init --hooks
          git diff --quiet                     # second init (with and without --hooks) is a no-op
          npx qualiow validate --all
          test -x qa/bin/mcli
          test ! -f qa/bin/qualiow             # the launcher shim never ships into a consumer project
          test -f .claude/skills/qa-explore/SKILL.md
          test -f .claude/agents/qa-gather-agent.md
          test -f qa/.env.example
          test -f qa/hooks/read-guard.mjs && test -f qa/hooks/write-guard.mjs && test -f .claude/settings.json
          node qa/bin/mobile-cli.mjs version
          npx qualiow kb digest --for explore | head -3
          npx qualiow session list
          npx qualiow list sessions

      - name: Mobile toolchain doctor (report only)
        if: runner.os == 'macOS'
        run: bin/doctor-mobile.sh --android --quiet || true

  plugin:
    name: plugin manifest and marketplace
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ci/tools/package-lock.json

      - name: Manifest matches package.json
        run: |
          node -e "const p=require('./.claude-plugin/plugin.json'),k=require('./package.json'); if(p.name!=='qualiow'||p.version!==k.version){console.error('plugin.json mismatch');process.exit(1)}"

      # The CLI is pinned in ci/tools (Dependabot-tracked). Its postinstall installs the native
      # binary, so scripts run here and only here; an install failure fails the job.
      - name: Install the pinned claude CLI
        working-directory: ci/tools
        run: npm ci --no-audit --no-fund

      - name: Validate plugin and marketplace
        run: |
          CLAUDE="$GITHUB_WORKSPACE/ci/tools/node_modules/.bin/claude"
          "$CLAUDE" --version
          "$CLAUDE" plugin validate .
          "$CLAUDE" plugin validate .claude-plugin/marketplace.json
